name: CI

# Validates every pull request and every push to main. This workflow never publishes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test tooling (vitest, jsdom, tsup) needs Node 22+. Node 20 is covered by `node20` below.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, lint, format, tests on React 19 and 18, build, publint, attw, pack contents
      - run: pnpm verify

  node20:
    name: Runtime smoke test (Node 20)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Some sites still declare Node 20 (SevaPremi .nvmrc 20.18.1, IT Vidya >=20.9).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke-node.mjs

  examples:
    name: Example Next.js apps (packed tarball)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:examples

  drafts:
    name: Draft content report (informational)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Draft content is allowed on main and for `next` prereleases; it only blocks `latest`.
      - run: pnpm check:drafts
        continue-on-error: true
